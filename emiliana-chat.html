<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Votre espace de conversation Emiliana.">
  <title>Conversation — Emiliana</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/emiliana.css">
  <script defer src="/assets/app.js"></script>
</head>
<body data-page="chat">
  <div class="app-shell">
    <aside class="app-sidebar"><div class="sidebar-brand"><a class="brand" href="/"><span class="brand-mark">e</span><span class="brand-name">Emiliana</span></a></div><nav class="sidebar-nav" aria-label="Navigation de l’espace"><a href="/chat" aria-current="page"><span aria-hidden="true">◌</span> Conversation</a><a href="/about"><span aria-hidden="true">i</span> À propos</a></nav><div class="sidebar-bottom"><div class="user-chip"><span class="avatar avatar-sm js-avatar">E</span><div><strong class="js-user-name">Votre espace</strong><span class="js-user-email"></span></div></div><button class="btn btn-quiet btn-small js-logout" type="button">Se déconnecter</button></div></aside>
    <main class="app-main"><header class="app-topbar"><div style="display:flex;align-items:center;gap:12px"><button class="btn btn-secondary btn-small mobile-only" type="button" data-sidebar-toggle aria-label="Ouvrir le menu">Menu</button><div><p class="eyebrow" style="margin:0 0 2px">Votre espace</p><h1>Conversation</h1></div></div><span class="badge">Privé</span></header><div class="app-content"><div class="chat-layout"><section class="panel" aria-labelledby="companions-title"><div class="panel-header"><h2 id="companions-title">Choisir une présence</h2></div><div id="companion-list" class="companion-list"></div></section><section class="panel chat-panel" aria-labelledby="chat-companion-name"><div class="panel-header"><div class="chat-header-profile"><span id="chat-avatar" class="avatar avatar-lg">E</span><div><strong id="chat-companion-name">Emiliana</strong><span id="chat-companion-role">Présence attentive</span></div></div><span class="badge">En ligne</span></div><div id="message-list" class="message-list" aria-live="polite"></div><div id="chat-status" class="chat-status">Votre espace de conversation</div><form id="chat-form" class="composer"><label class="sr-only" for="chat-input">Votre message</label><textarea id="chat-input" maxlength="2000" placeholder="Écrire un message…" required></textarea><button class="btn btn-primary" type="submit">Envoyer</button></form></section></div></div></main>
  </div>
  <div id="toast" class="toast" hidden role="status"></div>
</body>
</html>
